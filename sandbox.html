<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilience Landscapes - Terrain Sandbox</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #fafafa;
            font-family: 'Work Sans', sans-serif;
        }

        #sandbox-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #toolbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
        }

        .tool-btn {
            background: #eee;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #ddd;
        }

        .tool-btn.active {
            background: #e3f2fd;
            border-color: #2196f3;
            color: #0d47a1;
        }

        #io-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .io-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #status-msg {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="sandbox-container">
        <canvas id="sandbox-canvas"></canvas>

        <div id="toolbar">
            <button class="tool-btn active" data-tool="lift" onclick="setTool('lift')">⬆️ Lift</button>
            <button class="tool-btn" data-tool="lower" onclick="setTool('lower')">⬇️ Lower</button>
            <button class="tool-btn" data-tool="ball" onclick="setTool('ball')">🏐 Set Start</button>

            <div style="width: 1px; height: 20px; background: #ccc; margin: 0 10px;"></div>

            <div style="display: flex; flex-direction: column; align-items: center; margin-right: 10px;">
                <label style="font-size: 10px; color: #666; margin-bottom: 2px;">Strength</label>
                <input type="range" id="brush-strength" min="0.1" max="1.5" step="0.1" value="0.6" style="width: 80px;">
            </div>

            <div style="width: 1px; height: 20px; background: #ccc; margin: 0 10px;"></div>

            <button class="tool-btn" onclick="undo()" id="btn-undo" disabled>↩️ Undo</button>
            <button class="tool-btn" onclick="resetTerrain()">🔄 Reset</button>
        </div>

        <div id="io-panel">
            <button class="io-btn" onclick="importScen()">Import JSON</button>
            <button class="io-btn" onclick="exportScen()">Export JSON</button>
        </div>

        <div id="status-msg">Action Saved</div>
    </div>

    <!-- Dependencies -->
    <script src="js/perlin.js"></script>
    <script src="js/terrain.js"></script>
    <script src="js/ball.js"></script>
    <script src="js/acts/act2-landscape-data.js"></script>
    <script src="js/sandbox.js"></script>

</body>

</html>
